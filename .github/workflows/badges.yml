name: update-badges

permissions:
  contents: write

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 17 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install httpx binary
        run: |
          curl -sL https://github.com/projectdiscovery/httpx/releases/download/v1.10.0/httpx_1.10.0_linux_amd64.zip -o httpx.zip
          unzip -o httpx.zip httpx -d /usr/local/bin
          chmod +x /usr/local/bin/httpx
          httpx -version

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.2
      - run: bundle install

      - name: Gather CRAN data
        run: bash scrape_pkgs.sh

      - name: Scrape html
        run: rake scrape

      - name: Make svgs
        run: rake makesvgs

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: svgs/badges
